  <button class="big" id="startBtn">タップしてはじめる</button>
  <div id="titleMsg"></div>
</div>

<div id="select" class="screen">
  <h2>🌟 ステージをえらぶ</h2>
  <p class="lead">ステージを始めたときの持ち方が「水平」になります。楽な角度で持ってから選んでね。</p>
  <div id="stageList"></div>
  <div class="row">
    <button class="sbtn" id="sndBtn2">🔊 音楽+効果音</button>
    <button class="sbtn" id="resetBtn">記録を消す</button>

</div>

<div id="play" class="screen">
  <div id="cv"></div>
  <div id="lvl"><div id="lvlDot"></div></div>

    <button class="ib" id="levelBtn" aria-label="今の傾きを水平にする">⟲</button>
  </div>
  <div id="loading">3Dを読み込み中…</div>

  <div id="over"><div class="panel">
    <h3 id="oTitle">クリア!</h3>
    <div class="res" id="oRes"></div>
    <button class="pbtn" id="nextBtn">次のステージへ</button>
    <button class="pbtn sec" id="retryBtn">もう一回</button>
    <button class="pbtn sec" id="backBtn">ステージをえらぶ</button>
  </div></div>

  g ゴルドー(その場でふわふわ)   h ゴルドー(左右に往復)   v ゴルドー(上下に往復)  ※ゴルドーは穴の上も浮いて通る */

    "#########"]},
];
STAGES.forEach(s => { s.group = s.group || "normal"; });
const GROUPS = [
  { id: "easy", title: "🌱 かんたん迷路", note: "穴もゴルドーもなし。いつでも遊べる" },
  { id: "normal", title: "⭐ ふつう", note: "クリアすると次のステージが遊べる" },
  { id: "hard", title: "🔥 むずかしい", note: "「ゴルドー大行進」をクリアすると遊べる" },
];
const groupIdx = id => STAGES.map((s, i) => s.group === id ? i : -1).filter(i => i >= 0);
function stageLabel(i){ const s = STAGES[i], n = groupIdx(s.group).indexOf(i) + 1;
  return s.group === "easy" ? "かんたん" + n : s.group === "hard" ? "むずかしい" + n : String(n); }
function nextInGroup(i){ const l = groupIdx(STAGES[i].group), k = l.indexOf(i); return k >= 0 && k < l.length - 1 ? l[k + 1] : null; }

/* ===== 保存 ===== */
const SAVE_KEY = "korokoro-tilt-v1";
let save = {};
try { save = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}") || {}; } catch (e) { save = {}; }
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
function rec(i){ return save["s"+i] || null; }

/* ===== 音(すべてその場で合成。曲はカービィ風のオリジナル) ===== */
// soundMode: 2 = 音楽+効果音、1 = 効果音だけ、0 = 音なし
let soundMode = typeof save.soundMode === "number" ? save.soundMode : (save.sound === false ? 0 : 2);
let actx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null, waves = {};
function initAudio(){
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(actx.destination);
    master = actx.createGain(); master.gain.value = 0.9; master.connect(comp);
    musicBus = actx.createGain(); musicBus.gain.value = 0.2; musicBus.connect(master);
    sfxBus = actx.createGain(); sfxBus.gain.value = 0.5; sfxBus.connect(master);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    for (const duty of [0.125, 0.25, 0.5]) {                 // ファミコン風のパルス波
      const n = 40, re = new Float32Array(n), im = new Float32Array(n);
      for (let k = 1; k < n; k++) re[k] = 2 / (k * Math.PI) * Math.sin(k * Math.PI * duty);
      waves[duty] = actx.createPeriodicWave(re, im);
    }
    const b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0); // iOSの音の解錠
  }
  if (actx.state === "suspended") actx.resume();
}
const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function hz(name){ const m = /^([A-G])([#b]?)(-?\d)$/.exec(name); let n = NOTE[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
  return 440 * Math.pow(2, (n + (+m[3] + 1) * 12 - 69) / 12); }
// 1音を鳴らす
function voice(bus, kind, f, t, dur, vol){
  const g = actx.createGain(); g.connect(bus);
  if (kind === "bell") {                                     // 鈴のような音
    for (const [mul, v] of [[1, 1], [2, 0.35], [3.01, 0.12]]) {
      const o = actx.createOscillator(), og = actx.createGain(); o.type = "sine"; o.frequency.value = f * mul;
      og.gain.value = v; o.connect(og); og.connect(g); o.start(t); o.stop(t + 1.6);
    }
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
    return;
  }
  const o = actx.createOscillator();
  if (kind === "tri") o.type = "triangle"; else o.setPeriodicWave(waves[kind === "pulse12" ? 0.125 : kind === "pulse50" ? 0.5 : 0.25]);
  o.frequency.setValueAtTime(f, t);
  if (kind === "pulse" && dur > 0.28) {                       // 長い音にはビブラート
    const l = actx.createOscillator(), lg = actx.createGain(); l.frequency.value = 5.5; lg.gain.setValueAtTime(0, t);
    lg.gain.linearRampToValueAtTime(f * 0.012, t + 0.25); l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur + 0.1);
  }
  const rel = kind === "tri" ? 0.03 : 0.05;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(vol * (kind === "tri" ? 0.85 : 0.6), t + Math.min(dur, 0.09));
  g.gain.setValueAtTime(vol * (kind === "tri" ? 0.85 : 0.6), t + dur); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + rel);
  o.connect(g); o.start(t); o.stop(t + dur + rel + 0.02);
}
function drum(bus, kind, t, vol){
  if (kind === "kick") {
    const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16); o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.18); return;
  }
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(); s.buffer = noiseBuf;
  if (kind === "snare") { f.type = "bandpass"; f.frequency.value = 1900; f.Q.value = 0.7; } else { f.type = "highpass"; f.frequency.value = 7500; }
  const len = kind === "snare" ? 0.13 : 0.035;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  s.connect(f); f.connect(g); g.connect(bus); s.start(t, Math.random() * 0.5); s.stop(t + len + 0.01);
}

/* --- 曲(1小節 = 8分音符8つ。"." はのばす、"-" は休み) --- */
const SONGS = {

    const kk = i % 2 ? k * 0.62 : k;  // 先っぽはやわらかく、くびれは少しだけ丸める

    grp.rotation.y = e.dir * 1.25; board.add(grp); return { grp, upper, arms, feet };
  });
  // ゴルドー: 藍色の球、正面に大きな目2つ、まわりに放射状の金色のトゲ8本(見本の絵の配置)
  const gordos = g.gordos.map(() => {
    const grp = new THREE.Group(), inner = new THREE.Group(); grp.add(inner);
    const RB = 0.25;
    const body = new THREE.Mesh(GEO.waddle, M.gordo); body.scale.setScalar(RB); body.castShadow = true; inner.add(body);
    // 目(白目→瞳→光の順に少しずつ前へ)。体の表面に沿わせて置く
    for (const sd of [-1, 1]) {
      const yaw = sd * 0.5, pitch = 0.22;
      const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
      const eye = new THREE.Group(); eye.position.copy(dir.clone().multiplyScalar(RB * 0.93));
      eye.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
      const w = new THREE.Mesh(GEO.foot, M.gordoEyeW); w.scale.set(RB * 0.46, RB * 0.52, RB * 0.17);
      const pu = new THREE.Mesh(GEO.foot, M.gordoPupil); pu.scale.set(RB * 0.33, RB * 0.37, RB * 0.13); pu.position.set(-sd * RB * 0.03, -RB * 0.03, RB * 0.075);
      const sh = new THREE.Mesh(GEO.foot, M.gordoShine); sh.scale.set(RB * 0.085, RB * 0.085, RB * 0.04); sh.position.set(RB * 0.1, RB * 0.13, RB * 0.17);
      eye.add(w, pu, sh); inner.add(eye);
    }
    // トゲ: 顔の面のまわりに8本、少し後ろへ傾ける
    const up = new THREE.Vector3(0, 1, 0);
    for (let k = 0; k < 8; k++) {
      const a = (95 - k * 45 + (k % 2 ? 6 : -4)) * Math.PI / 180;
      const v = new THREE.Vector3(Math.cos(a), Math.sin(a), -0.28).normalize();
      const sp = new THREE.Mesh(GEO.spike, M.spike); sp.castShadow = true;
      sp.quaternion.setFromUnitVectors(up, v); sp.position.copy(v.clone().multiplyScalar(RB + 0.11));
      sp.scale.y = 1 + (k % 3 === 0 ? 0.12 : k % 3 === 1 ? -0.05 : 0.04);
      inner.add(sp);
    }
    inner.rotation.x = -0.85;                                          // 顔とトゲの面をカメラへ向ける
    board.add(grp); return { grp, inner };
  });
  // カービィ(足なし、まん丸)
  const R = 0.34;
  const kirby = new THREE.Mesh(GEO.kirby, M.kirby); kirby.scale.setScalar(R); kirby.castShadow = true;
  const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -0.6); // 顔を少しカメラ側へ
  kirby.quaternion.copy(q); board.add(kirby);

  // 影を落とす範囲
  const span = Math.max(g.cols, g.rows) / 2 + 2;
  Object.assign(sun.shadow.camera, { left: -span, right: span, top: span, bottom: -span, near: 1, far: 60 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.position.set(cx - 6, 18, cz - 4); sun.target.position.set(cx, 0, cz);

  objs = { g, R, goal, glow, stars, bumpers, enemies, gordos, kirby, lastX: g.x, lastY: g.y, faceQ: q.clone() };
  fitCamera();
  document.getElementById("loading").style.display = "none";
}

/* ---------- カメラ ---------- */
let W = innerWidth, H = innerHeight;
function fitCamera(){
  if (!objs) return;
  const g = objs.g, aspect = W / H, vf = camera.fov * Math.PI / 180;
  camera.aspect = aspect; camera.updateProjectionMatrix();
  const pitch = 58 * Math.PI / 180;                        // 見下ろす角度
  const hf = 2 * Math.atan(Math.tan(vf / 2) * aspect);
  const dW = (g.cols + 1.2) / 2 / Math.tan(hf / 2);
  const dH = (g.rows * Math.sin(pitch) + 1.5) / (2 * Math.tan(vf / 2) * 0.86);
  const d = Math.max(dW, dH) * 1.02;
  const tx = g.cols / 2, tz = g.rows / 2 + 0.35;
  camera.position.set(tx, Math.sin(pitch) * d, tz + Math.cos(pitch) * d);
  camera.lookAt(tx, 0, tz);
}
function resize(w, h){ W = w; H = h; renderer.setSize(w, h, false); fitCamera(); }

/* ---------- 毎フレーム ---------- */
const axis = new THREE.Vector3(), dq = new THREE.Quaternion();
let t = 0;
function render(g, dt, tx, ty){
  if (!g) return;
  if (!objs || objs.g !== g) build(g);
  t += dt;
  const o = objs, k = o.kirby;
  // 盤面を少し傾けて見せる
  pivot.rotation.x += ((ty || 0) * 0.07 - pivot.rotation.x) * Math.min(1, dt * 8);
  pivot.rotation.z += (-(tx || 0) * 0.07 - pivot.rotation.z) * Math.min(1, dt * 8);

  // カービィ: 進んだぶんだけ転がす
  const dx = g.x - o.lastX, dz = g.y - o.lastY, dist = Math.hypot(dx, dz);
  if (dist > 1e-5 && dist < 1.5 && g.state === "play") {
    axis.set(dz, 0, -dx).normalize(); dq.setFromAxisAngle(axis, dist / o.R);
    k.quaternion.premultiply(dq);
  }
  o.lastX = g.x; o.lastY = g.y;
  let y = o.R, s = o.R, sq = g.squash || 0;
  if (g.state === "fall") { const p = Math.min(1, g.stateT / 0.6); y = o.R - p * 2.2; s = o.R * (1 - p * 0.5); }
  else if (g.state === "ready") { k.quaternion.slerp(o.faceQ, Math.min(1, dt * 10)); }
  if (g.state === "clear") { const p = Math.min(1, g.stateT / 1.2); y = o.R + 0.25 + p * 1.6; k.quaternion.slerp(o.faceQ, Math.min(1, dt * 6)); }
  if (g.state === "hit") { k.position.x = g.x + Math.sin(g.stateT * 60) * 0.04; } else k.position.x = g.x;
  k.position.z = g.y; k.position.y = y - sq * 0.05;
  k.scale.set(s * (1 + sq * 0.12), s * (1 - sq * 0.15), s * (1 + sq * 0.12));
  k.visible = !(g.inv && Math.floor(g.inv * 10) % 2);
  if (g.state === "play" && (o.prevState === "fall" || o.prevState === "hit")) k.quaternion.copy(o.faceQ); // やり直しで顔を正面に
  o.prevState = g.state;

  // ゴールとスター
  o.goal.rotation.y = t * 1.3;
  o.goal.position.y = 0.45 + Math.sin(t * 2.5) * 0.06 + (g.state === "clear" ? Math.min(1, g.stateT / 1.2) * 1.6 : 0);
  o.glow.intensity = 2.5 + Math.sin(t * 4) * 0.8;
  g.stars.forEach((st, i) => {
    const m = o.stars[i];
    if (st.got) { if (m.visible) { m.userData.p = (m.userData.p || 0) + dt * 3; m.position.y = 0.32 + m.userData.p; m.scale.setScalar(Math.max(0, 1 - m.userData.p)); if (m.userData.p >= 1) m.visible = false; } }
    else { m.visible = true; m.userData.p = 0; const b = Math.abs(Math.sin(t * 3.2 + i * 1.3)); m.scale.set(1 + (1 - b) * 0.08, 1 - (1 - b) * 0.1, 1); m.rotation.y = Math.sin(t * 1.6 + i) * 0.7; m.position.y = 0.36 + b * 0.12; } // ぽよんと弾む
  });
  g.bumpers.forEach((b, i) => { const s2 = 1 + b.hit * 0.18; o.bumpers[i].top.scale.set(s2, 1 - b.hit * 0.25, s2); });
  g.enemies.forEach((e, i) => {
    const en = o.enemies[i], p = e.ph;
    en.grp.position.set(e.x, 0, e.y);
    // 進む向きへくるっと振り返る(真横より少しカメラ寄りを向く)
    en.grp.rotation.y += (e.dir * 1.25 - en.grp.rotation.y) * Math.min(1, dt * 9);
    // 足を左右交互に踏み出す(前後に動かし、前に出す足を持ち上げる)
    en.feet.forEach((f, k) => {
      const q2 = Math.sin(p + k * Math.PI);
      f.position.z = 0.03 + q2 * 0.1; f.position.y = 0.07 + Math.max(0, Math.cos(p + k * Math.PI)) * 0.06;
      f.rotation.x = -q2 * 0.35;
    });
    // 腕は足と逆に振る、体は上下にはずみ左右に揺れる
    en.arms.forEach((a, k) => { a.position.z = 0.02 - Math.sin(p + k * Math.PI) * 0.07; a.position.y = 0.34 + Math.abs(Math.sin(p)) * 0.01; });
    en.upper.position.y = Math.abs(Math.cos(p)) * 0.035;
    en.upper.rotation.z = Math.sin(p) * 0.09; en.upper.rotation.x = 0.06;
    // ぶつかられたら、ぴょんと跳ねてびっくり
    const bb = e.bump || 0; en.upper.scale.set(1 + bb * 0.1, 1 - bb * 0.14 + Math.max(0, bb - 0.6) * 0.5, 1 + bb * 0.1);
    en.upper.position.y += Math.sin(bb * Math.PI) * 0.12;
  });
  g.gordos.forEach((gd, i) => {
    const go = o.gordos[i];
    go.grp.position.set(gd.x, 0.42 + Math.sin(t * 2.4 + i) * 0.07, gd.y);   // ふわふわ浮く
    go.inner.rotation.z = Math.sin(t * 1.7 + i) * 0.12;
    const pulse = 1 + Math.sin(t * 6 + i) * 0.03; go.inner.scale.setScalar(pulse);
  });
  renderer.render(scene, camera);
}

window.R3 = { build, render, resize };
resize(innerWidth, innerHeight);
if (typeof pendingBuild !== "undefined" && pendingBuild) build(pendingBuild);
</script>
</body>
</html>
