<html lang="ja">
<head>

<meta name="theme-color" content="#ff8fb8">
<title>コロコロカービィ 傾き迷路</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#ffd6e6;font-family:-apple-system,"Hiragino Sans","Hiragino Maru Gothic ProN",sans-serif;color:#4a2438;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
  button{font:inherit;-webkit-tap-highlight-color:transparent}
  .screen{position:fixed;inset:0;display:none;flex-direction:column}
  .screen.on{display:flex}
  /* タイトル */
  #title{align-items:center;justify-content:center;text-align:center;padding:24px;
    background:radial-gradient(circle at 50% 35%,#fff7fb 0,#ffd6e6 55%,#ffb3cf 100%)}
  #title h1{font-size:30px;margin:12px 0 4px;letter-spacing:1px}
  #title h1 small{display:block;font-size:16px;color:#9b4f72;margin-top:4px}
  #title p{font-size:14px;line-height:1.7;margin:10px 0}
  #titleKirby{width:150px;height:150px}
  .big{font-size:20px;font-weight:800;padding:16px 34px;border:none;border-radius:999px;background:#ff5f99;color:#fff;
    box-shadow:0 5px 0 #d23c75;margin-top:14px}
  .big:active{transform:translateY(3px);box-shadow:0 2px 0 #d23c75}
  #titleMsg{font-size:13px;min-height:1.5em;color:#b0284f;margin-top:10px}
  /* ステージ選択 */
  #select{padding:calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));overflow-y:auto;touch-action:pan-y;background:#fff4f8}
  #select h2{font-size:20px;margin:6px 2px 2px}
  #select .lead{font-size:12px;color:#8a5a70;margin:0 2px 12px}
  .stg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid #ffd0e1;border-radius:16px;
    padding:12px 14px;margin-bottom:10px;color:inherit;min-height:70px}
  .stg:active{background:#fff0f6}
  .stg.lock{opacity:.45}
  .stg .no{width:38px;height:38px;border-radius:50%;background:#ff8fb8;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
  .stg.clear .no{background:#f5b400}
  .stg .nm{font-weight:800;font-size:16px}
  .stg .ds{font-size:12px;color:#8a5a70;margin-top:2px}
  .stg .rc{margin-left:auto;text-align:right;font-size:12px;color:#7a5566;white-space:nowrap}
  .stg .rc b{font-size:15px;color:#4a2438}
  .row{display:flex;gap:8px;margin-top:6px}
  .sbtn{flex:1;padding:12px;border:none;border-radius:12px;background:#e9d6df;color:#5a3346;font-weight:700;font-size:14px}
  /* プレイ */
  #play{background:#ffe3ee}
  #cv{position:absolute;inset:0}
  #cv canvas{display:block;width:100%;height:100%}
  #lvl{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;
    background:#0003;border:1.5px solid #fff9;pointer-events:none;display:flex;align-items:center;justify-content:center}
  #lvlDot{width:12px;height:12px;border-radius:50%;background:#ff8fb8;box-shadow:0 0 0 2px #fff}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#9b4f72;pointer-events:none}
  #hud{position:absolute;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;display:flex;align-items:center;gap:6px;
    background:linear-gradient(#0000004d,#0000);color:#fff;text-shadow:0 1px 2px #0008;pointer-events:none}
  #hud .t{font-size:13px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #hud .v{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ib{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:none;background:#ffffffd9;color:#4a2438;font-size:18px;flex:none}
  #toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:26px;font-weight:900;color:#fff;
    text-shadow:0 2px 0 #c2185b,0 0 12px #0006;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
  #over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0006;padding:20px}
  #over.on{display:flex}
  .panel{background:#fff;border-radius:22px;padding:20px 18px 16px;width:100%;max-width:340px;text-align:center;box-shadow:0 10px 30px #0004}
  .panel h3{margin:0 0 6px;font-size:24px}
  .panel .res{font-size:15px;line-height:1.9;margin:6px 0 10px}
  .panel .res b{font-size:20px}
  .panel .nb{color:#e0306e;font-weight:900}
  .pbtn{display:block;width:100%;padding:14px;border:none;border-radius:14px;background:#ff5f99;color:#fff;font-weight:800;font-size:17px;margin-top:8px}
  .pbtn.sec{background:#eadbe2;color:#5a3346}
</style>

<body>

<div id="title" class="screen on">
  <canvas id="titleKirby" width="300" height="300"></canvas>
  <h1>コロコロカービィ<small>かたむけ迷路</small></h1>
  <p>iPhoneをかたむけてカービィを転がし、<br>ワープスターまで運ぼう。<br>穴に落ちたらスタートからやり直し。</p>
  <button class="big" id="startBtn">タップしてはじめる</button>
  <div id="titleMsg"></div>
</div>

<div id="select" class="screen">
  <h2>🌟 ステージをえらぶ</h2>
  <p class="lead">ステージを始めたときの持ち方が「水平」になります。楽な角度で持ってから選んでね。</p>
  <div id="stageList"></div>
  <div class="row">
    <button class="sbtn" id="sndBtn2">🔊 音あり</button>
    <button class="sbtn" id="resetBtn">記録を消す</button>
  </div>
</div>

<div id="play" class="screen">
  <div id="cv"></div>
  <div id="lvl"><div id="lvlDot"></div></div>
  <div id="hud">
    <button class="ib" id="quitBtn" aria-label="ステージ選択へ">✕</button>
    <div class="t" id="hName"></div>
    <div class="v" id="hStar">★0/0</div>
    <div class="v" id="hTime">0.0</div>
    <button class="ib" id="levelBtn" aria-label="今の傾きを水平にする">⟲</button>
  </div>
  <div id="loading">3Dを読み込み中…</div>
  <div id="toast"></div>
  <div id="over"><div class="panel">
    <h3 id="oTitle">クリア!</h3>
    <div class="res" id="oRes"></div>
    <button class="pbtn" id="nextBtn">次のステージへ</button>
    <button class="pbtn sec" id="retryBtn">もう一回</button>
    <button class="pbtn sec" id="backBtn">ステージをえらぶ</button>
  </div></div>
</div>

<script>
"use strict";
/* ===== ステージ =====
  # 壁   . 床   o 穴   ~ 氷   * スター   S スタート   G ワープスター
  B バンパー   w ワドルディ(横に往復)
  g ゴルドー(その場でふわふわ)   h ゴルドー(左右に往復)   v ゴルドー(上下に往復)  ※ゴルドーは穴の上も浮いて通る */
const STAGES = [
  { name:"はじめての草原", desc:"まずは転がしてみよう", map:[
    "#########",
    "#S......#",
    "#######.#",
    "#*......#",
    "#.#######",
    "#......*#",
    "#######.#",
    "#G......#",
    "#########"]},
  { name:"あなぼこ広場", desc:"穴に落ちないように", map:[
    "#########",
    "#S..o...#",
    "#.o...o.#",
    "#...o..*#",
    "#o.o..o.#",
    "#...*...#",
    "#.o..o.o#",
    "#*..o..G#",
    "#########"]},
  { name:"ほそみち渡り", desc:"両側が穴の細い道", map:[
    "#########",
    "#S......#",
    "#oooooo.#",
    "#*......#",
    "#.oooooo#",
    "#.......#",
    "#oooooo.#",
    "#G.....*#",
    "#########"]},
  { name:"ワドルディの見張り", desc:"ワドルディにぶつからないで", map:[
    "#########",
    "#S......#",
    "#.......#",
    "#w......#",
    "#.......#",
    "#...#..*#",
    "#......w#",
    "#.......#",
    "#w......#",
    "#*.....G#",
    "#########"]},
  { name:"つるつる氷の洞くつ", desc:"止まりにくい氷の床", map:[
    "#########",
    "#S~~~~~~#",
    "#~~~~~~~#",
    "#~~o~~o~#",
    "#~~~~~~~#",
    "#o~~*~~o#",
    "#~~~~~~~#",
    "#~o~~~o~#",
    "#~~~~~~~#",

    "#########"]},
  { name:"バンパー迷路", desc:"はね返りに注意", map:[
    "#########",
    "#S..#...#",
    "#.B.#.B.#",
    "#...#.*.#",
    "#.#####.#",
    "#.B...B.#",
    "#...B...#",
    "###...###",
    "#*..B..*#",
    "#...h...#",
    "#ooo.ooo#",
    "#...G...#",
    "#########"]},
  { name:"デデデ城への道", desc:"これまでの全部が出てくる", map:[
    "#########",
    "#S.o....#",
    "#..o.w..#",
    "#..o...*#",
    "#.....o.#",
    "#oooo.o.#",
    "#*....o.#",
    "#.oooooo#",
    "#.~~~~~~#",
    "#.~~g~~*#",
    "#.~~o~~~#",
    "#......w#",
    "#.#####.#",
    "#.B...B.#",
    "#...G...#",
    "#########"]},
  { name:"デデデ大王の挑戦状", desc:"鬼むずかしい", map:[
    "#########",
    "#S#.....#",
    "#.#.ooo.#",
    "#.#.o*o.#",
    "#.#.o.o.#",
    "#.....o.#",
    "#oooo.o*#",
    "#.....o.#",
    "#.oooooo#",
    "#.......#",
    "#...w...#",
    "#.......#",
    "#oooooo.#",
    "#~~~~~~.#",
    "#~oooooo#",
    "#~~~~~~~#",
    "#oooooo~#",
    "#G~~~~~~#",
    "#########"]},
  { name:"ゴルドーの谷", desc:"トゲトゲのゴルドーは無敵", map:[
    "#########",
    "#S......#",
    "#.......#",
    "#..g.g..#",
    "#.......#",
    "#oo.h.oo#",
    "#.......#",
    "#*.v.v.*#",
    "#.......#",
    "#...g...#",
    "#...G...#",
    "#########"]},
  { name:"ゴルドー大行進", desc:"すき間を通るタイミングが勝負", map:[
    "#########",
    "#S..o...#",
    "#.h.o.h.#",
    "#...o..*#",
    "#.......#",
    "#ooo.ooo#",
    "#...v...#",
    "#.......#",
    "#.g.o.g.#",
    "#...o...#",
    "#*.v.v..#",
    "#.......#",
    "#oo.h.oo#",
    "#...G...#",
    "#########"]},
];

/* ===== 保存 ===== */
const SAVE_KEY = "korokoro-tilt-v1";
let save = {};
try { save = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}") || {}; } catch (e) { save = {}; }
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
function rec(i){ return save["s"+i] || null; }

/* ===== 音 ===== */
let actx = null, soundOn = save.sound !== false;
function initAudio(){ if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (actx && actx.state==="suspended") actx.resume(); }
function tone(f, d, type, vol, slide){
  if (!soundOn || !actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "square"; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + 0.02);
}
const sfx = {
  star(){ tone(988,.08,"square",.07); setTimeout(()=>tone(1319,.14,"square",.07),70); },
  fall(){ tone(600,.5,"triangle",.12,90); },
  hit(){ tone(180,.25,"sawtooth",.1,60); },
  bump(){ tone(420,.07,"square",.06,700); },
  wall(v){ tone(140,.05,"triangle",Math.min(.1,.02+v*.008)); },
  clear(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,"square",.08),i*110)); },
};
function updSnd(){ document.getElementById("sndBtn2").textContent = soundOn ? "🔊 音あり" : "🔇 音なし"; }

/* ===== 傾きセンサー ===== */
let tiltB = null, tiltG = null, zb = 0, zg = 0, sensorOk = false;
const keys = {};
function screenAngle(){
  if (screen.orientation && typeof screen.orientation.angle === "number") return screen.orientation.angle;
  return typeof window.orientation === "number" ? window.orientation : 0;
}
window.addEventListener("deviceorientation", e => {
  if (e.beta == null || e.gamma == null) return;
  tiltB = e.beta; tiltG = e.gamma; sensorOk = true;
});
function rawTilt(){ // 画面の向きに合わせた (左右, 前後)
  if (tiltB == null) return [0,0];
  const a = ((screenAngle() % 360) + 360) % 360;
  if (a === 90) return [tiltB, -tiltG];
  if (a === 270) return [-tiltB, tiltG];
  if (a === 180) return [-tiltG, -tiltB];
  return [tiltG, tiltB];
}
function level(){ const r = rawTilt(); zg = r[0]; zb = r[1]; }
function tiltVec(){
  let x = 0, y = 0;
  if (tiltB != null) { const r = rawTilt(); x = r[0] - zg; y = r[1] - zb; }
  if (keys.ArrowLeft) x -= 20; if (keys.ArrowRight) x += 20; if (keys.ArrowUp) y -= 20; if (keys.ArrowDown) y += 20;
  const c = v => Math.max(-40, Math.min(40, v));
  return [Math.sin(c(x) * Math.PI / 180), Math.sin(c(y) * Math.PI / 180)];
}
addEventListener("keydown", e => { keys[e.key] = true; });
addEventListener("keyup", e => { keys[e.key] = false; });

/* ===== 画面切り替え ===== */
function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }

document.getElementById("startBtn").addEventListener("click", async () => {
  initAudio();
  const msg = document.getElementById("titleMsg");
  try {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      const st = await DeviceOrientationEvent.requestPermission();
      if (st !== "granted") { msg.textContent = "傾きセンサーが許可されませんでした。Safariを閉じて開き直し、もう一度押してください。"; return; }
    }
  } catch (e) { msg.textContent = "センサーの許可でエラー: " + e.message; return; }
  buildList(); show("select");
});

function fmt(t){ return t.toFixed(1) + "秒"; }
function unlocked(i){ return i === 0 || !!(rec(i-1) && rec(i-1).clear); }
function buildList(){
  const box = document.getElementById("stageList"); box.innerHTML = "";
  STAGES.forEach((s, i) => {
    const r = rec(i), total = countStars(s.map), ok = unlocked(i);
    const b = document.createElement("button");
    b.className = "stg" + (ok ? "" : " lock") + (r && r.clear ? " clear" : "");
    b.innerHTML = `<div class="no">${ok ? i+1 : "🔒"}</div><div><div class="nm">${s.name}</div><div class="ds">${s.desc}</div></div>` +
      `<div class="rc">${r && r.clear ? `ベスト <b>${fmt(r.best)}</b><br>★${r.stars}/${total}` : (ok ? "まだクリアしていない" : "前をクリアで解放")}</div>`;
    b.addEventListener("click", () => { if (ok) { initAudio(); startStage(i); } });
    box.appendChild(b);
  });
  updSnd();
}
document.getElementById("sndBtn2").addEventListener("click", () => { soundOn = !soundOn; save.sound = soundOn; persist(); updSnd(); initAudio(); });
document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("全ステージの記録を消しますか?")) { const s = save.sound; save = { sound: s }; persist(); buildList(); }
});
function countStars(map){ return map.join("").split("*").length - 1; }

/* ===== ゲーム本体 ===== */
let W = 0, H = 0;
function resize(){ W = innerWidth; H = innerHeight; if (window.R3) R3.resize(W, H); }
addEventListener("resize", resize); resize();

const R = 0.34;            // カービィの半径(マス)
const ACC = 22;            // 傾き1(=90°)のときの加速度(マス/秒²)
const VMAX = 9;
let G = null;              // 現在のステージの状態
let pendingBuild = null;   // 3D描画の読み込み前に始めたステージ

function startStage(i){
  const s = STAGES[i], grid = s.map.map(r => r.split(""));
  const g = { i, grid, rows: grid.length, cols: grid[0].length, stars: [], enemies: [], bumpers: [], gordos: [],
    sx: 0, sy: 0, gx: 0, gy: 0, x: 0, y: 0, vx: 0, vy: 0, spin: 0, t: 0, got: 0, total: 0, miss: 0,
    state: "ready", stateT: 0, camY: 0, squash: 0 };
  for (let r = 0; r < g.rows; r++) for (let c = 0; c < g.cols; c++) {
    const ch = grid[r][c];
    if (ch === "S") { g.sx = c + .5; g.sy = r + .5; grid[r][c] = "."; }
    else if (ch === "G") { g.gx = c + .5; g.gy = r + .5; grid[r][c] = "."; }
    else if (ch === "*") { g.stars.push({ x: c + .5, y: r + .5, got: false }); grid[r][c] = "."; }
    else if (ch === "w") { g.enemies.push({ x: c + .5, y: r + .5, dir: 1, sp: 1.6 + i * 0.12, ph: Math.random() * 6 }); grid[r][c] = "."; }
    else if (ch === "B") { g.bumpers.push({ x: c + .5, y: r + .5, hit: 0 }); grid[r][c] = "."; }
    else if (ch === "g" || ch === "h" || ch === "v") {
      g.gordos.push({ kind: ch, c, r, x: c + .5, y: r + .5, ph: Math.random() * 6 });
      grid[r][c] = (grid[r][c - 1] === "~" || grid[r][c + 1] === "~") ? "~" : ".";
    }
  }
  for (const o of g.gordos) {
    o.ph = 0; o.cx = o.x; o.cy = o.y; o.amp = 0;
    if (o.kind === "h" || o.kind === "v") {
      const dc = o.kind === "h" ? 1 : 0, dr = o.kind === "v" ? 1 : 0; let a = 0, b = 0;
      while (a < 2 && grid[o.r - dr * (a + 1)] && grid[o.r - dr * (a + 1)][o.c - dc * (a + 1)] !== "#") a++;
      while (b < 2 && grid[o.r + dr * (b + 1)] && grid[o.r + dr * (b + 1)][o.c + dc * (b + 1)] !== "#") b++;
      o.amp = (a + b) / 2; if (dc) o.cx = o.x + (b - a) / 2; else o.cy = o.y + (b - a) / 2;
    }
  }
  g.total = g.stars.length; g.x = g.sx; g.y = g.sy;
  G = g;
  if (window.R3) R3.build(g); else pendingBuild = g;
  document.getElementById("hName").textContent = (i + 1) + ". " + s.name;
  document.getElementById("over").classList.remove("on");
  show("play"); resize(); level();
  g.camY = targetCam();
  toast("よーい…", 900);
  setTimeout(() => { if (G === g && g.state === "ready") { level(); g.state = "play"; toast("スタート!", 700); } }, 900);
  updHud();
}
function cell(c, r){ if (!G || r < 0 || c < 0 || r >= G.rows || c >= G.cols) return "#"; return G.grid[r][c]; }
function walkable(ch){ return ch === "." || ch === "~"; }

let toastTimer = 0;
function toast(t, ms){ const el = document.getElementById("toast"); el.textContent = t; el.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.opacity = 0, ms || 800); }
function updHud(){ if (!G) return; document.getElementById("hStar").textContent = "★" + G.got + "/" + G.total;
  document.getElementById("hTime").textContent = G.t.toFixed(1); }

function cellPx(){ return W / G.cols; }
function viewRows(){ return H / cellPx(); }
function targetCam(){ const vr = viewRows(), max = Math.max(0, G.rows - vr);
  const top = G.rows <= vr ? -(vr - G.rows) / 2 : Math.max(0, Math.min(max, G.y - vr * 0.5));
  return top; }

function step(dt){
  const g = G; if (!g) return;
  g.stateT += dt;
  // ワドルディ
  for (const e of g.enemies) {
    e.ph += dt * e.sp * 4.2;   // 歩く速さに合わせて足を運ぶ
    const nx = e.x + e.dir * e.sp * dt, edge = nx + e.dir * 0.4;
    if (!walkable(cell(Math.floor(edge), Math.floor(e.y))) || g.bumpers.some(b => Math.abs(b.x - Math.floor(edge) - .5) < .1 && Math.abs(b.y - e.y) < .1)) e.dir *= -1;
    else e.x = nx;
  }
  for (const b of g.bumpers) b.hit = Math.max(0, b.hit - dt * 4);
  // ゴルドー(なめらかに往復。端でゆっくりになる)

    g.t += dt;

    g.vx += tx * ACC * dt; g.vy += ty * ACC * dt;
    const fr = Math.exp(-(ice ? 0.25 : 1.7) * dt); g.vx *= fr; g.vy *= fr;
    const sp = Math.hypot(g.vx, g.vy); if (sp > VMAX) { g.vx *= VMAX / sp; g.vy *= VMAX / sp; }

    for (let k = 0; k < N; k++) { g.x += g.vx * dt / N; g.y += g.vy * dt / N; collide(); }

function drawKirby(c, x, y, rad, spin, opts){

function roundStarShape(ro, ri, k){

  for (let i = 0; i < n; i++) {
    const p = pts[i], prev = pts[(i + n - 1) % n], next = pts[(i + 1) % n];
    const kk = i % 2 ? k * 0.62 : k;  // 先っぽはやわらかく、くびれは少しだけ丸める
    const a = lerp(p, prev, kk), b = lerp(p, next, kk);

function starGeo(size, thick){
  const outline = roundStarShape(size, size * 0.56, 0.16).getSpacedPoints(200); outline.pop();
  const n = outline.length, RINGS = 16, xy = [];

  // 縁(輪郭)までの距離
  function edgeDist(x, y){
    let best = 1e9;
    for (let i = 0; i < n; i++) {
      const a = outline[i], b = outline[(i + 1) % n], vx = b.x - a.x, vy = b.y - a.y;
      const t = Math.max(0, Math.min(1, ((x - a.x) * vx + (y - a.y) * vy) / (vx * vx + vy * vy)));

  for (let j = 1; j < RINGS; j++) for (let i = 0; i < n; i++) tri.push([V(j, i), V(j + 1, i), V(j + 1, i + 1)], [V(j, i), V(j + 1, i + 1), V(j, i + 1)]);
  // 高さをならす(縁は0のまま)
  const nb = Array.from({ length: N }, () => new Set());
  for (const [a, b, c] of tri) { nb[a].add(b).add(c); nb[b].add(a).add(c); nb[c].add(a).add(b); }
  for (let it = 0; it < 10; it++) {
    const h2 = h.slice();
    for (let i = 0; i < edgeStart; i++) { let sum = 0; for (const k of nb[i]) sum += h[k]; h2[i] = h[i] * 0.5 + 0.5 * sum / nb[i].size; }
    h = h2;
  }
  // 表と裏を作る(縁の輪は共有)
  const pos = [], back = new Array(N);
  xy.forEach(([x, y], i) => pos.push(x, y, h[i]));
  xy.forEach(([x, y], i) => { if (i >= edgeStart) back[i] = i; else { back[i] = pos.length / 3; pos.push(x, y, -h[i]); } });

}

  }
  inst(GEO.floor, M.grassA, cellsA, -0.5);
  inst(GEO.floor, M.grassB, cellsB, -0.5);
  inst(GEO.floor, M.ice, ice, -0.5);
  inst(GEO.wall, M.wall, walls, 0.4);
  // 穴の底
  for (const [c, r] of pits) { const p = new THREE.Mesh(GEO.pit, M.pit); p.rotation.x = -Math.PI / 2; p.position.set(c + .5, -2.2, r + .5); board.add(p); }
  // 盤の下の土台(穴の奥が抜けて見えないように)
  const base = new THREE.Mesh(new THREE.BoxGeometry(g.cols + 0.4, 1.4, g.rows + 0.4), M.dirt);
  base.position.set(cx, -2.95, cz); board.add(base);

  // ゴール
  const goal = new THREE.Mesh(GEO.goal, M.goal); goal.castShadow = true;
  goal.position.set(g.gx, 0.45, g.gy); goal.rotation.x = -0.35; board.add(goal);
  const glow = new THREE.PointLight("#ffe066", 3, 3.5, 1.5); glow.position.set(g.gx, 0.8, g.gy); board.add(glow);
  // スター
  const stars = g.stars.map(s => { const m = new THREE.Mesh(GEO.star, M.star); m.castShadow = true; m.position.set(s.x, 0.32, s.y); board.add(m); return m; });
  // バンパー
  const bumpers = g.bumpers.map(b => {
    const grp = new THREE.Group(); grp.position.set(b.x, 0, b.y);
    const base = new THREE.Mesh(GEO.bumperBase, M.bumperBase); base.position.y = 0.04; base.receiveShadow = true;
    const top = new THREE.Mesh(GEO.bumper, M.bumper); top.position.y = 0.22; top.castShadow = true;
    const st = new THREE.Mesh(GEO.bumperStar, M.white); st.rotation.x = -Math.PI / 2; st.position.y = 0.4;
    grp.add(base, top, st); board.add(grp); return { grp, top };
  });
  // ワドルディ
  // ワドルディ: 体(少し横長の球)・小さな腕・黄色い大きな足。顔は +z 向き
  const enemies = g.enemies.map(e => {
    const grp = new THREE.Group(), upper = new THREE.Group(); grp.add(upper);
    const body = new THREE.Mesh(GEO.waddle, M.waddle); body.scale.set(0.335, 0.3, 0.32); body.position.y = 0.37; body.castShadow = true;
    upper.add(body);
    const arms = [-1, 1].map(sd => { const a = new THREE.Mesh(GEO.foot, M.waddleArm); a.scale.set(0.085, 0.075, 0.1); a.position.set(sd * 0.32, 0.34, 0.02); a.castShadow = true; upper.add(a); return a; });
    const feet = [-1, 1].map(sd => { const f = new THREE.Mesh(GEO.foot, M.waddleFoot); f.scale.set(0.12, 0.07, 0.17); f.position.set(sd * 0.14, 0.07, 0.03); f.castShadow = true; grp.add(f); return f; });
    grp.rotation.y = e.dir * 1.25; board.add(grp); return { grp, upper, arms, feet };
  });
  // ゴルドー: 紺色の球に白銀のトゲ(正十二面体の向きに12本+あいだに8本)
  const gordos = g.gordos.map(() => {
    const grp = new THREE.Group(), inner = new THREE.Group(); grp.add(inner);
    const body = new THREE.Mesh(GEO.waddle, M.gordo); body.scale.setScalar(0.26); body.castShadow = true; inner.add(body);
    const dirs = [], phi = (1 + Math.sqrt(5)) / 2;
    for (const [a, b] of [[1, phi], [-1, phi], [1, -phi], [-1, -phi]]) dirs.push([0, a, b], [a, b, 0], [b, 0, a]);
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) if (!(sy < 0 && sx < 0)) dirs.push([sx * 0.6, sy, 0.15]);
    const up = new THREE.Vector3(0, 1, 0);
    for (const d of dirs) {
      const v = new THREE.Vector3(...d).normalize();
      if (v.z > 0.75 && Math.abs(v.y) < 0.45) continue;              // 目の前にはトゲを出さない
      const sp = new THREE.Mesh(GEO.spike, M.spike); sp.castShadow = true;
      sp.quaternion.setFromUnitVectors(up, v); sp.position.copy(v.multiplyScalar(0.3)); inner.add(sp);
    }
    inner.rotation.x = -0.45;                                          // 顔を少しカメラ側へ
    board.add(grp); return { grp, inner };
  });
  // カービィ(足なし、まん丸)
  const R = 0.34;
  const kirby = new THREE.Mesh(GEO.kirby, M.kirby); kirby.scale.setScalar(R); kirby.castShadow = true;
  const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -0.6); // 顔を少しカメラ側へ
  kirby.quaternion.copy(q); board.add(kirby);

  // 影を落とす範囲
  const span = Math.max(g.cols, g.rows) / 2 + 2;
  Object.assign(sun.shadow.camera, { left: -span, right: span, top: span, bottom: -span, near: 1, far: 60 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.position.set(cx - 6, 18, cz - 4); sun.target.position.set(cx, 0, cz);

  objs = { g, R, goal, glow, stars, bumpers, enemies, gordos, kirby, lastX: g.x, lastY: g.y, faceQ: q.clone() };
  fitCamera();
  document.getElementById("loading").style.display = "none";
}

/* ---------- カメラ ---------- */
let W = innerWidth, H = innerHeight;
function fitCamera(){
  if (!objs) return;
  const g = objs.g, aspect = W / H, vf = camera.fov * Math.PI / 180;
  camera.aspect = aspect; camera.updateProjectionMatrix();
  const pitch = 58 * Math.PI / 180;                        // 見下ろす角度
  const hf = 2 * Math.atan(Math.tan(vf / 2) * aspect);
  const dW = (g.cols + 1.2) / 2 / Math.tan(hf / 2);
  const dH = (g.rows * Math.sin(pitch) + 1.5) / (2 * Math.tan(vf / 2) * 0.86);
  const d = Math.max(dW, dH) * 1.02;
  const tx = g.cols / 2, tz = g.rows / 2 + 0.35;
  camera.position.set(tx, Math.sin(pitch) * d, tz + Math.cos(pitch) * d);
  camera.lookAt(tx, 0, tz);
}
function resize(w, h){ W = w; H = h; renderer.setSize(w, h, false); fitCamera(); }

/* ---------- 毎フレーム ---------- */
const axis = new THREE.Vector3(), dq = new THREE.Quaternion();
let t = 0;
function render(g, dt, tx, ty){
  if (!g) return;
  if (!objs || objs.g !== g) build(g);
  t += dt;
  const o = objs, k = o.kirby;
  // 盤面を少し傾けて見せる
  pivot.rotation.x += ((ty || 0) * 0.07 - pivot.rotation.x) * Math.min(1, dt * 8);
  pivot.rotation.z += (-(tx || 0) * 0.07 - pivot.rotation.z) * Math.min(1, dt * 8);

  // カービィ: 進んだぶんだけ転がす
  const dx = g.x - o.lastX, dz = g.y - o.lastY, dist = Math.hypot(dx, dz);
  if (dist > 1e-5 && dist < 1.5 && g.state === "play") {
    axis.set(dz, 0, -dx).normalize(); dq.setFromAxisAngle(axis, dist / o.R);
    k.quaternion.premultiply(dq);
  }
  o.lastX = g.x; o.lastY = g.y;
  let y = o.R, s = o.R, sq = g.squash || 0;
  if (g.state === "fall") { const p = Math.min(1, g.stateT / 0.6); y = o.R - p * 2.2; s = o.R * (1 - p * 0.5); }
  else if (g.state === "ready") { k.quaternion.slerp(o.faceQ, Math.min(1, dt * 10)); }
  if (g.state === "clear") { const p = Math.min(1, g.stateT / 1.2); y = o.R + 0.25 + p * 1.6; k.quaternion.slerp(o.faceQ, Math.min(1, dt * 6)); }
  if (g.state === "hit") { k.position.x = g.x + Math.sin(g.stateT * 60) * 0.04; } else k.position.x = g.x;
  k.position.z = g.y; k.position.y = y - sq * 0.05;
  k.scale.set(s * (1 + sq * 0.12), s * (1 - sq * 0.15), s * (1 + sq * 0.12));
  k.visible = !(g.inv && Math.floor(g.inv * 10) % 2);
  if (g.state === "play" && (o.prevState === "fall" || o.prevState === "hit")) k.quaternion.copy(o.faceQ); // やり直しで顔を正面に
  o.prevState = g.state;

  // ゴールとスター
  o.goal.rotation.y = t * 1.3;
  o.goal.position.y = 0.45 + Math.sin(t * 2.5) * 0.06 + (g.state === "clear" ? Math.min(1, g.stateT / 1.2) * 1.6 : 0);
  o.glow.intensity = 2.5 + Math.sin(t * 4) * 0.8;
  g.stars.forEach((st, i) => {
    const m = o.stars[i];
    if (st.got) { if (m.visible) { m.userData.p = (m.userData.p || 0) + dt * 3; m.position.y = 0.32 + m.userData.p; m.scale.setScalar(Math.max(0, 1 - m.userData.p)); if (m.userData.p >= 1) m.visible = false; } }
    else { m.visible = true; m.userData.p = 0; const b = Math.abs(Math.sin(t * 3.2 + i * 1.3)); m.scale.set(1 + (1 - b) * 0.08, 1 - (1 - b) * 0.1, 1); m.rotation.y = Math.sin(t * 1.6 + i) * 0.7; m.position.y = 0.36 + b * 0.12; } // ぽよんと弾む
  });
  g.bumpers.forEach((b, i) => { const s2 = 1 + b.hit * 0.18; o.bumpers[i].top.scale.set(s2, 1 - b.hit * 0.25, s2); });
  g.enemies.forEach((e, i) => {
    const en = o.enemies[i], p = e.ph;
    en.grp.position.set(e.x, 0, e.y);
    // 進む向きへくるっと振り返る(真横より少しカメラ寄りを向く)
    en.grp.rotation.y += (e.dir * 1.25 - en.grp.rotation.y) * Math.min(1, dt * 9);
    // 足を左右交互に踏み出す(前後に動かし、前に出す足を持ち上げる)
    en.feet.forEach((f, k) => {
      const q2 = Math.sin(p + k * Math.PI);
      f.position.z = 0.03 + q2 * 0.1; f.position.y = 0.07 + Math.max(0, Math.cos(p + k * Math.PI)) * 0.06;
      f.rotation.x = -q2 * 0.35;
    });
    // 腕は足と逆に振る、体は上下にはずみ左右に揺れる
    en.arms.forEach((a, k) => { a.position.z = 0.02 - Math.sin(p + k * Math.PI) * 0.07; a.position.y = 0.34 + Math.abs(Math.sin(p)) * 0.01; });
    en.upper.position.y = Math.abs(Math.cos(p)) * 0.035;
    en.upper.rotation.z = Math.sin(p) * 0.09; en.upper.rotation.x = 0.06;
  });
  g.gordos.forEach((gd, i) => {
    const go = o.gordos[i];
    go.grp.position.set(gd.x, 0.42 + Math.sin(t * 2.4 + i) * 0.07, gd.y);   // ふわふわ浮く
    go.inner.rotation.z = Math.sin(t * 1.7 + i) * 0.12;
    const pulse = 1 + Math.sin(t * 6 + i) * 0.03; go.inner.scale.setScalar(pulse);
  });
  renderer.render(scene, camera);
}

window.R3 = { build, render, resize };
resize(innerWidth, innerHeight);
if (typeof pendingBuild !== "undefined" && pendingBuild) build(pendingBuild);
</script>
</body>
</html>
